<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exemplo — Componente de Acessibilidade | Fundação Fênix 193</title>

<!-- 1. Incluir em TODAS as páginas do site, sempre nesta ordem -->
<link rel="stylesheet" href="acessibilidade.css">
</head>
<body>

  <header>
    <h1>Fundação Fênix 193</h1>
    <nav aria-label="Navegação principal">
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="nossa-historia.html">Nossa História</a></li>
        <li><a href="projetos.html">Projetos</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content">
    <section aria-labelledby="video-title">
      <h2 id="video-title">Vídeo institucional</h2>

      <!-- 2. Player acessível com audiodescrição -->
      <div class="media-player"
           data-ad-track="ad-video-institucional.json"
           data-video-title="Vídeo institucional Fundação Fênix 193">
        <video preload="metadata" poster="assets/img/capa-video.jpg">
          <source src="assets/video/institucional.mp4" type="video/mp4">
          <track kind="captions" src="legendas-pt.vtt" srclang="pt" label="Português" default>
          Seu navegador não suporta a reprodução de vídeo.
        </video>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Fundação Fênix 193.</p>
  </footer>

  <!-- 3. Scripts ao final do body, nesta ordem -->
  <script src="acessibilidade.js" defer></script>
  <script src="media-player.js" defer></script>
</body>
</html>
