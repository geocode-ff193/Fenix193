<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="author" content="GeoCODE Programmer · Geovani Santos">
    <meta name="theme-color" content="#313332">
    <meta name="description" content="Fundação Fênix 193 - 404 ERROR">
    <meta name="apple-mobile-web-app-title" content="FF193" />
    <title>Fundação Fênix 193 · Página não encontrada</title>
    <link rel="manifest" href="site.webmanifest" />
    <link rel="icon" type="image/x-icon" href="assets/ui/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/ui/favicon.svg" />
    <link rel="shortcut icon" href="assets/ui/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/ui/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400;1,600&family=Lato:wght@300;400;700&display=swap">
    <style>
        :root {
            --ink-soft: #E12217;
            --gold: #F27613;
            --cream: #FFFFFF;
            --text: #313332;
            --accent: #872020;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--cream);
            font-family: 'Lato', sans-serif;
            color: var(--text);
            text-align: center;
        }

        .container {
            max-width: 500px;
            padding: 2rem;
        }

        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: 120px;
            color: var(--ink-soft);
            line-height: 1;
            margin-bottom: 10px;
            opacity: 0.2;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            margin-bottom: 15px;
            color: var(--ink-soft);
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--ink-soft);
            color: var(--cream);
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(118, 51, 26, 0.2);
        }

        .btn-home:hover {
            background: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(118, 51, 26, 0.3);
        }

        .icon-404 {
            font-size: 50px;
            color: var(--gold);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <div class="icon-404">
            <img src="assets/ui/favicon-96x96.png" alt="Ícone">
        </div>
        <h1>Página não encontrada</h1>
        <p>Parece que o caminho que você tentou seguir não está disponível no momento.</p>
        <a href="index.html" class="btn-home">
            <i class="fas fa-arrow-left"></i> Voltar ao Início
        </a>
    </div>
</body>
</html>
